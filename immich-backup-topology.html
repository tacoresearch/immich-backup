<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Havellnode4 — Immich Backup Topology</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #6b6a65;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);

    --slot-1:         #2a78d6; /* host / hypervisor */
    --slot-1-tint:    #cde2fb;
    --slot-2:         #eb6834; /* LXC / storage */
    --slot-2-tint:    #fddcc9;
    --slot-3:         #1baf7a; /* VM / compute-docker */
    --slot-3-tint:    #c3ecdc;
    --slot-4:         #eda100; /* external NAS */
    --slot-4-tint:    #fbe4b3;

    --seq-100:        #cde2fb;
    --seq-450:        #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #e6e5de;
      --text-muted:     #a8a6a0;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);

      --slot-1:         #3987e5;
      --slot-1-tint:    #17324f;
      --slot-2:         #d95926;
      --slot-2-tint:    #4a2b18;
      --slot-3:         #199e70;
      --slot-3-tint:    #123c2e;
      --slot-4:         #c98500;
      --slot-4-tint:    #4a3308;

      --seq-100:        #17324f;
      --seq-450:        #3987e5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #e6e5de;
    --text-muted:     #a8a6a0;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);

    --slot-1:         #3987e5;
    --slot-1-tint:    #17324f;
    --slot-2:         #d95926;
    --slot-2-tint:    #4a2b18;
    --slot-3:         #199e70;
    --slot-3-tint:    #123c2e;
    --slot-4:         #c98500;
    --slot-4-tint:    #4a3308;

    --seq-100:        #17324f;
    --seq-450:        #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); font-weight: 500; font-size: 13px; margin: 0 0 24px; }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  figure { margin: 0 0 40px; }
  figcaption { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .fig-note { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); margin: 0 0 16px; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  /* legend */
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 0 0 18px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  /* diagram */
  .diagram-scroll { overflow-x: auto; }
  .topology { display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 720px; padding: 4px; }

  .host-frame {
    width: 100%; max-width: 960px;
    border: 1.5px dashed var(--baseline); border-radius: 10px;
    padding: 18px 22px 24px;
    display: flex; flex-direction: column; align-items: center;
  }
  .host-frame .frame-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
  .host-frame .frame-sub { font-size: 11.5px; color: var(--text-secondary); font-weight: 500; margin: 1px 0 14px; }

  .node {
    border-radius: 8px; padding: 12px 14px;
    font-size: 13.5px; line-height: 1.55; color: var(--text-primary);
  }
  .node h3 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 7px; }
  .node .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .node p { margin: 6px 0 0; color: var(--text-primary); font-weight: 500; }
  .node .mono { font-variant-numeric: tabular-nums; }
  .node .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color: var(--text-secondary); margin-bottom:3px; }

  .box-zfs   { width: 280px; background: var(--slot-1-tint); border: 1px solid var(--slot-1); }
  .box-fs4   { flex: 1 1 380px; max-width: 440px; background: var(--surface-1); border: 1.5px solid var(--slot-2); }
  .box-dh4   { flex: 1 1 380px; max-width: 440px; background: var(--surface-1); border: 1.5px solid var(--slot-3); }
  .box-immich{ margin-top: 14px; background: var(--slot-3-tint); border: 1px solid var(--slot-3); }
  .box-nas   { width: 100%; max-width: 660px; background: var(--slot-4-tint); border: 1.5px solid var(--slot-4); }

  .guest-row { display: flex; align-items: stretch; gap: 0; width: 100%; justify-content: center; }

  .connector { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .connector .arrow { font-size: 20px; line-height: 1; color: var(--text-secondary); }
  .connector.vertical { padding: 4px 0; }
  .connector.horizontal { padding: 0 16px; }

  /* meter */
  .meter-value { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .meter-track { position: relative; height: 20px; border-radius: 5px; background: var(--seq-100); overflow: hidden; margin: 10px 0 8px; }
  .meter-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--seq-450); border-radius: 5px 4px 4px 5px; }
  .meter-ticks { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .meter-legend { display:flex; gap:18px; font-size:12.5px; font-weight: 500; color: var(--text-secondary); margin-top:14px; }

  table.details { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  table.details th, table.details td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  table.details th { color: var(--text-secondary); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .02em; }
  table.details td { color: var(--text-primary); font-weight: 500; }
  table.details td.mono { font-variant-numeric: tabular-nums; white-space: nowrap; }

  details.tableview { margin-top: 14px; }
  details.tableview summary { cursor: pointer; font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1>Havellnode4 — Immich storage &amp; compute topology</h1>
        <p class="sub">Current state, ahead of backup planning · as of 2026-08-01</p>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">Toggle dark mode</button>
    </div>

    <!-- DIAGRAM -->
    <figure>
      <figcaption>Infrastructure map</figcaption>
      <p class="fig-note">Proxmox host, its guests, and the external NAS — with the mount/share path data takes to reach Immich.</p>
      <div class="card">
        <div class="legend">
          <div class="legend-item"><span class="swatch" style="background:var(--slot-1)"></span>Proxmox host / hypervisor</div>
          <div class="legend-item"><span class="swatch" style="background:var(--slot-2)"></span>LXC container (storage/SMB)</div>
          <div class="legend-item"><span class="swatch" style="background:var(--slot-3)"></span>VM (compute / Docker)</div>
          <div class="legend-item"><span class="swatch" style="background:var(--slot-4)"></span>External NAS</div>
        </div>
        <div class="diagram-scroll">
          <div class="topology">
            <div class="host-frame">
              <div class="frame-label">Havellnode4 — Proxmox VE host</div>
              <div class="frame-sub">10.10.10.116:8006 · 1&nbsp;TB SSD as a ZFS pool</div>

              <div class="node box-zfs">
                <span class="tag">ZFS pool</span>
                <h3><span class="dot" style="background:var(--slot-1)"></span>oneteebee</h3>
                <p>1&nbsp;TB SSD, local to host</p>
                <p class="mono">930&nbsp;GB provisioned to fileserver4</p>
              </div>

              <div class="connector vertical"><span class="arrow">↓</span><span>mp0 passthrough</span></div>

              <div class="guest-row">
                <div class="node box-fs4">
                  <span class="tag">LXC · CT 402</span>
                  <h3><span class="dot" style="background:var(--slot-2)"></span>fileserver4</h3>
                  <p>Debian · SMB file server (45Drives / Cockpit plugins)</p>
                  <p class="mono">IP 10.10.10.90</p>
                  <p><strong>mp0:</strong> oneteebee:subvol-402-disk-0</p>
                  <p class="mono">mp=/mnt/data, size=930GB, backup=1</p>
                </div>

                <div class="connector horizontal"><span class="arrow">→</span><span>SMB share</span></div>

                <div class="node box-dh4">
                  <span class="tag">VM · 405</span>
                  <h3><span class="dot" style="background:var(--slot-3)"></span>dockerhost4</h3>
                  <p>Debian · Docker host</p>
                  <p><strong>Cron-mounted network shares:</strong></p>
                  <p class="mono">/mnt/fileserver4 ← fileserver4 (SMB)</p>
                  <p class="mono">/mnt/bobnology ← Synology bobnology (SMB)</p>

                  <div class="node box-immich">
                    <span class="tag">Docker</span>
                    <h3><span class="dot" style="background:var(--slot-3)"></span>Immich stack</h3>
                    <p>Reads/writes through both mounted paths above</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="connector vertical"><span class="arrow">↑</span><span>SMB share</span></div>

            <div class="node box-nas">
              <span class="tag">External · not on Havellnode4</span>
              <h3><span class="dot" style="background:var(--slot-4)"></span>Synology NAS — bobnology</h3>
              <p class="mono">10.10.10.185 · share path /filz/photos</p>
            </div>
          </div>
        </div>
      </div>
    </figure>

    <!-- STORAGE METER -->
    <figure>
      <figcaption>ZFS pool capacity — oneteebee</figcaption>
      <p class="fig-note">How much of the 1&nbsp;TB SSD pool is committed to fileserver4's mp0 subvol.</p>
      <div class="card">
        <p class="meter-value">930 GB allocated of 1,024 GB pool <span style="color:var(--text-secondary); font-weight:400;">(90.8%)</span></p>
        <div class="meter-track">
          <div class="meter-fill" style="width:90.8%"></div>
        </div>
        <div class="meter-ticks"><span>0 GB</span><span>512 GB</span><span>1,024 GB</span></div>
        <div class="meter-legend">
          <div class="legend-item"><span class="swatch" style="background:var(--seq-450)"></span>Allocated to fileserver4 (mp0)</div>
          <div class="legend-item"><span class="swatch" style="background:var(--seq-100)"></span>Unallocated headroom</div>
        </div>

        <details class="tableview">
          <summary>View as table</summary>
          <table class="details">
            <thead><tr><th>Metric</th><th>Value</th></tr></thead>
            <tbody>
              <tr><td>ZFS pool total (oneteebee)</td><td class="mono">1,024 GB (1 TB SSD)</td></tr>
              <tr><td>Allocated — mp0 → fileserver4 subvol-402-disk-0</td><td class="mono">930 GB</td></tr>
              <tr><td>Unallocated headroom</td><td class="mono">94 GB (9.2%)</td></tr>
              <tr><td>Utilization</td><td class="mono">90.8%</td></tr>
            </tbody>
          </table>
        </details>
      </div>
    </figure>

    <!-- DETAILS TABLE -->
    <figure>
      <figcaption>Node details</figcaption>
      <p class="fig-note">Full reference — everything shown in the diagram above, in one table.</p>
      <div class="card">
        <table class="details">
          <thead>
            <tr><th>Node</th><th>Type</th><th>ID</th><th>Address</th><th>Role</th><th>Storage / mounts</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>Havellnode4</td><td>Proxmox VE host</td><td>—</td>
              <td class="mono">10.10.10.116:8006</td>
              <td>Hypervisor</td>
              <td>1 TB SSD as ZFS pool "oneteebee"</td>
            </tr>
            <tr>
              <td>fileserver4</td><td>LXC (Debian)</td><td class="mono">CT 402</td>
              <td class="mono">10.10.10.90</td>
              <td>SMB file server (45Drives / Cockpit plugins)</td>
              <td>mp0: oneteebee:subvol-402-disk-0 → /mnt/data, 930GB, backup=1</td>
            </tr>
            <tr>
              <td>dockerhost4</td><td>VM (Debian)</td><td class="mono">405</td>
              <td>—</td>
              <td>Docker host running Immich</td>
              <td>Cron-mounted: /mnt/fileserver4 (→ fileserver4), /mnt/bobnology (→ Synology NAS)</td>
            </tr>
            <tr>
              <td>bobnology</td><td>Synology NAS</td><td>—</td>
              <td class="mono">10.10.10.185</td>
              <td>External photo storage, off-host</td>
              <td>Share path /filz/photos</td>
            </tr>
          </tbody>
        </table>
      </div>
    </figure>
  </div>
</div>

<script>
  const btn = document.getElementById('themeToggle');
  btn.addEventListener('click', () => {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  });
</script>
</body>
</html>
